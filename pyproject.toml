[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxforge-studio"
version = "1.0.0"
description = "Autonomous Zero-API-Key Pure-Code 3D & Physics Cinema Documentary Engine (Research -> Code-Render -> Audit -> Improve -> 1080p24 MP4)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "imageio-ffmpeg>=0.5.1",
    "av>=12.0.0",
    "opencv-python-headless>=4.8.0",
    "numba>=0.60.0",
    "onnxruntime>=1.18.0",
    "kaldi-native-fbank>=1.20.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "soundfile>=0.12.1",
    "piper-tts>=1.2.0",
    "kokoro-onnx>=0.4.0",
    "edge-tts>=6.1.0",
    "espeakng-loader>=0.2.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
local-llm = [
    "llama-cpp-python>=0.3.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
voxforge = "voxforge.cli:main"
documentary = "voxforge.cli:main"
podcast = "voxforge.cli:main"

[tool.setuptools.packages.find]
include = ["voxforge*"]

[tool.setuptools.package-data]
voxforge = ["assets/fonts/*", "assets/gis/*", "web/static/*"]
